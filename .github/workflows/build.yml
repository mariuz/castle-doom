# Native builds: Windows x86_64, Linux x86_64 and macOS x86_64 / aarch64 on
# GitHub's runners (FPC and the CGE snapshot set up by castle-build-ci, like
# CGE's own template castle-game/.github/workflows/build.yml),
# a Windows Installer (MSI) made with WiX from the Windows zip, and an
# Android APK built in CGE's Docker image.
#
# - On every push / pull request: build and keep the packages as workflow artifacts.
# - On a tag like v1.2.3: also attach the packages to a GitHub Release.
# - Run by hand (workflow_dispatch) with release_tag set: create that tag on
#   the chosen branch's commit and the same GitHub Release.
#
# See https://castle-engine.io/github_actions and https://castle-engine.io/docker

name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Create this release tag (e.g. v1.2.3) on the commit; empty: just build'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  # Windows and Linux packages on GitHub's runners with FPC and the CGE
  # snapshot set up by castle-build-ci (like the macOS job and CGE's own CI).
  # The CGE Docker image did the same, but Docker Hub's unauthenticated pull
  # rate limit on the shared runner IPs failed every third run.
  build-linux:
    name: Package Linux
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up FPC and Castle Game Engine
        timeout-minutes: 20
        run: |
          cd /tmp/
          git clone https://github.com/castle-engine/castle-build-ci.git \
            --depth=1 --single-branch --branch=master
          # castle-build-ci/install_dependencies, retried until wget is there
          # (Chocolatey's feed fails now and then), else a curl stand-in.
          source "$GITHUB_WORKSPACE/tools/ci_install_dependencies.sh"
          castle-build-ci/setup_castle_engine

      - name: Build Nuked OPL3 (shared library in data/lib)
        run: tools/build_nuked_opl3.sh

      - name: Package Linux (x86_64)
        run: castle-engine package --os=linux --cpu=x86_64 --mode=release --verbose

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: castle-doom-linux
          path: "*-linux-x86_64.tar.gz"
          if-no-files-found: error

  build-windows:
    name: Package Windows
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Set up FPC and Castle Game Engine
        timeout-minutes: 20
        run: |
          cd /tmp/
          git clone https://github.com/castle-engine/castle-build-ci.git \
            --depth=1 --single-branch --branch=master
          # castle-build-ci/install_dependencies, retried until wget is there
          # (Chocolatey's feed fails now and then), else a curl stand-in.
          source "$GITHUB_WORKSPACE/tools/ci_install_dependencies.sh"
          castle-build-ci/setup_castle_engine

      - name: Build Nuked OPL3 (shared library in data/lib)
        run: tools/build_nuked_opl3.sh

      - name: Package Windows (x86_64)
        run: castle-engine package --os=win64 --cpu=x86_64 --mode=release --verbose

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: castle-doom-windows
          path: "*-win64-x86_64.zip"
          if-no-files-found: error

  build-macos:
    name: Package macOS (${{ matrix.cpu }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            cpu: x86_64
          - runner: macos-latest
            cpu: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up FPC and Castle Game Engine
        timeout-minutes: 25
        run: |
          cd /tmp/
          git clone https://github.com/castle-engine/castle-build-ci.git \
            --depth=1 --single-branch --branch=master
          # castle-build-ci/install_dependencies, retried until wget is there
          # (Chocolatey's feed fails now and then), else a curl stand-in.
          source "$GITHUB_WORKSPACE/tools/ci_install_dependencies.sh"
          castle-build-ci/setup_castle_engine

      - name: Build Nuked OPL3 (shared library in data/lib)
        run: tools/build_nuked_opl3.sh

      # Not signed or notarized (no Apple developer certificate): the first
      # start needs right-click > Open, or xattr -dr com.apple.quarantine.
      - name: Package app bundle (zip)
        run: |
          castle-engine package --mode=release --package-format=mac-app-bundle-zip --verbose
          ls -l *.zip

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: castle-doom-macos-${{ matrix.cpu }}
          path: "*-darwin-*.zip"
          if-no-files-found: error

  # Android APK (64-bit ARM: every current device, and FPC 3.2.2's 32-bit
  # ARM code generator emits VFP immediates its assembler rejects) built
  # in CGE's Docker image, which has the
  # Android SDK and NDK and FPC's Android cross-compilers (castle-build-ci
  # sets up none of them). Docker Hub limits anonymous pulls per runner
  # IP, so the pull is retried a few times before the job gives up; the
  # release does not wait for this job's success (an APK is attached when
  # it was built).
  build-android:
    name: Package Android
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      IMAGE: kambi/castle-engine-cloud-builds-tools:cge-unstable
    steps:
      - uses: actions/checkout@v4

      - name: Pull the CGE build image
        timeout-minutes: 20
        run: |
          for attempt in 1 2 3 4; do
            docker pull "$IMAGE" && exit 0
            echo "Pull failed (attempt $attempt), waiting"
            sleep $((attempt * 90))
          done
          exit 1

      # Release signing when the repository has the secrets
      # ANDROID_KEYSTORE_BASE64 (a keystore, base64), ANDROID_KEY_ALIAS,
      # ANDROID_KEYSTORE_PASSWORD and ANDROID_KEY_PASSWORD; without them CGE
      # signs with a fresh debug key (castle-doom-X-android-debug.apk), so
      # an update then needs the old app uninstalled first.
      - name: Signing keys (when configured)
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "No signing secrets: a debug-signed APK"
            exit 0
          fi
          echo "$KEYSTORE" | base64 -d > android-release.keystore
          {
            echo "key.store=/project/android-release.keystore"
            echo "key.alias=$ALIAS"
            echo "key.store.password=$STORE_PASSWORD"
            echo "key.alias.password=$KEY_PASSWORD"
          } > AndroidSigningProperties.txt

      - name: Package Android (APK)
        timeout-minutes: 35
        run: |
          docker run --rm -v "$PWD:/project" -w /project "$IMAGE" \
            bash -c 'git config --global --add safe.directory /project && castle-engine package --os=android --cpu=aarch64 --mode=release --verbose'
          sudo chown -R "$(id -u):$(id -g)" .
          ls -l *.apk

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: castle-doom-android
          path: "*.apk"
          if-no-files-found: error

  # A Windows Installer package from the Windows zip: WiX 5 (pinned) on a
  # Windows runner, the .wxs written by tools/make_msi_wxs.py.
  build-msi:
    name: Package Windows installer (MSI)
    needs: build-windows
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: castle-doom-windows
          path: windows-zip

      - name: Install WiX
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix --version

      - name: Build the MSI
        run: |
          VERSION=$(sed -n 's/.*<version value="\([^"]*\)".*/\1/p' CastleEngineManifest.xml)
          python tools/make_msi_wxs.py windows-zip/*-win64-x86_64.zip "$VERSION" msi
          wix build -arch x64 msi/castle-doom.wxs -o "castle-doom-$VERSION-win64-x86_64.msi"
          ls -l *.msi

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: castle-doom-windows-msi
          path: "*-win64-x86_64.msi"
          if-no-files-found: error

  autotest:
    name: Autotests (Linux, Xvfb)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install FPC, GTK, OpenAL, Xvfb
        timeout-minutes: 10
        run: |
          sudo apt-get update
          sudo apt-get install -y fpc libgtk-3-dev libgtk2.0-dev libopenal1 libpng-dev xvfb libgl1-mesa-dri glbsp python3-pil

      - name: Build the Castle Game Engine build tool (snapshot)
        timeout-minutes: 10
        run: |
          git clone --depth 1 --branch snapshot https://github.com/castle-engine/castle-engine.git "$HOME/castle-engine"
          # The script expects to run from the engine's directory (castle-fpc.cfg).
          cd "$HOME/castle-engine" && ./tools/build-tool/castle-engine_compile.sh

      - name: Build Nuked OPL3 (shared library in data/lib)
        run: tools/build_nuked_opl3.sh

      - name: Compile
        timeout-minutes: 10
        run: |
          CASTLE_ENGINE_PATH="$HOME/castle-engine" "$HOME/castle-engine/tools/build-tool/castle-engine" compile --mode=release

      - name: Unit tests (FPCUnit)
        timeout-minutes: 5
        run: |
          python3 tools/make_znodes.py tools/testdata/nodes/
          python3 tools/make_glnodes.py tools/testdata/nodes
          CASTLE_ENGINE_PATH="$HOME/castle-engine" "$HOME/castle-engine/tools/build-tool/castle-engine" simple-compile tests/castle_doom_tests.lpr
          tests/castle_doom_tests --all --format=plain

      - name: Run autotests
        timeout-minutes: 15
        run: |
          xvfb-run -a -s "-screen 0 1280x800x24" python3 tools/run_autotests.py ./castle-doom autotest-output

      - name: Upload logs and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autotest-output
          path: |
            autotest-output/*.log
            autotest-output/*.png
          if-no-files-found: warn

  release:
    name: GitHub Release
    if: ${{ !cancelled() && (startsWith(github.ref, 'refs/tags/v') || startsWith(inputs.release_tag, 'v')) && needs.build-linux.result == 'success' && needs.build-windows.result == 'success' && needs.build-macos.result == 'success' && needs.build-msi.result == 'success' }}
    needs: [build-linux, build-windows, build-macos, build-msi, build-android]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.release_tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: packages
      - name: List packages
        run: ls -l packages
      # The release notes: this version's section of docs/CHANGELOG.md.
      - name: Release notes from the changelog
        run: |
          awk -v v="## $TAG " 'index($0, v) == 1 { on = 1; next } /^## / { on = 0 } on' docs/CHANGELOG.md > notes.md
          cat notes.md
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: Castle DOOM ${{ env.TAG }}
          body_path: notes.md
          files: |
            packages/*.zip
            packages/*.tar.gz
            packages/*.msi
            packages/*.apk
          generate_release_notes: true
