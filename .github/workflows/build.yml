# Native builds (Windows x86_64, Linux x86_64) using the Castle Game Engine
# Docker image, which bundles FPC with cross-compilers and the CGE build tool.
#
# - On every push / pull request: build and keep the packages as workflow artifacts.
# - On a tag like v1.2.3: also attach the packages to a GitHub Release.
#
# See https://castle-engine.io/github_actions and https://castle-engine.io/docker

name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-native:
    name: Package Windows and Linux
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container: kambi/castle-engine-cloud-builds-tools:cge-unstable
    steps:
      - uses: actions/checkout@v4

      - name: Show versions
        run: |
          castle-engine --version
          fpc -iV

      - name: Package Windows (x86_64)
        run: castle-engine package --os=win64 --cpu=x86_64 --mode=release --verbose

      - name: Package Linux (x86_64)
        run: castle-engine package --os=linux --cpu=x86_64 --mode=release --verbose

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: castle-doom-windows
          path: "*-win64-x86_64.zip"
          if-no-files-found: error

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: castle-doom-linux
          path: "*-linux-x86_64.tar.gz"
          if-no-files-found: error

  autotest:
    name: Autotests (Linux, Xvfb)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install FPC, GTK, OpenAL, Xvfb
        timeout-minutes: 10
        run: |
          sudo apt-get update
          sudo apt-get install -y fpc libgtk-3-dev libgtk2.0-dev libopenal1 libpng-dev xvfb libgl1-mesa-dri

      - name: Build the Castle Game Engine build tool (snapshot)
        timeout-minutes: 10
        run: |
          git clone --depth 1 --branch snapshot https://github.com/castle-engine/castle-engine.git "$HOME/castle-engine"
          "$HOME/castle-engine/tools/build-tool/castle-engine_compile.sh"

      - name: Compile
        timeout-minutes: 10
        run: |
          CASTLE_ENGINE_PATH="$HOME/castle-engine" "$HOME/castle-engine/tools/build-tool/castle-engine" compile --mode=release

      - name: Run autotests
        timeout-minutes: 15
        run: |
          xvfb-run -a -s "-screen 0 1280x800x24" python3 tools/run_autotests.py ./castle-doom autotest-output

      - name: Upload logs and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autotest-output
          path: |
            autotest-output/*.log
            autotest-output/*.png
          if-no-files-found: warn

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-native
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: packages
      - name: List packages
        run: ls -l packages
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            packages/*.zip
            packages/*.tar.gz
          generate_release_notes: true
