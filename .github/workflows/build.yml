# Native builds: Windows x86_64 and Linux x86_64 with the Castle Game Engine
# Docker image (FPC with cross-compilers and the CGE build tool), macOS
# x86_64 and aarch64 on GitHub's macOS runners (FPC and CGE set up by
# castle-build-ci, like CGE's own template castle-game/.github/workflows/build.yml).
#
# - On every push / pull request: build and keep the packages as workflow artifacts.
# - On a tag like v1.2.3: also attach the packages to a GitHub Release.
# - Run by hand (workflow_dispatch) with release_tag set: create that tag on
#   the chosen branch's commit and the same GitHub Release.
#
# See https://castle-engine.io/github_actions and https://castle-engine.io/docker

name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Create this release tag (e.g. v1.2.3) on the commit; empty: just build'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  build-native:
    name: Package Windows and Linux
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container: kambi/castle-engine-cloud-builds-tools:cge-unstable
    steps:
      - uses: actions/checkout@v4

      - name: Show versions
        run: |
          castle-engine --version
          fpc -iV

      - name: Package Windows (x86_64)
        run: castle-engine package --os=win64 --cpu=x86_64 --mode=release --verbose

      - name: Package Linux (x86_64)
        run: castle-engine package --os=linux --cpu=x86_64 --mode=release --verbose

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: castle-doom-windows
          path: "*-win64-x86_64.zip"
          if-no-files-found: error

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: castle-doom-linux
          path: "*-linux-x86_64.tar.gz"
          if-no-files-found: error

  build-macos:
    name: Package macOS (${{ matrix.cpu }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            cpu: x86_64
          - runner: macos-latest
            cpu: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up FPC and Castle Game Engine
        timeout-minutes: 25
        run: |
          cd /tmp/
          git clone https://github.com/castle-engine/castle-build-ci.git \
            --depth=1 --single-branch --branch=master
          castle-build-ci/install_dependencies
          castle-build-ci/setup_castle_engine

      # Not signed or notarized (no Apple developer certificate): the first
      # start needs right-click > Open, or xattr -dr com.apple.quarantine.
      - name: Package app bundle (zip)
        run: |
          castle-engine package --mode=release --package-format=mac-app-bundle-zip --verbose
          ls -l *.zip

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: castle-doom-macos-${{ matrix.cpu }}
          path: "*-darwin-*.zip"
          if-no-files-found: error

  autotest:
    name: Autotests (Linux, Xvfb)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install FPC, GTK, OpenAL, Xvfb
        timeout-minutes: 10
        run: |
          sudo apt-get update
          sudo apt-get install -y fpc libgtk-3-dev libgtk2.0-dev libopenal1 libpng-dev xvfb libgl1-mesa-dri

      - name: Build the Castle Game Engine build tool (snapshot)
        timeout-minutes: 10
        run: |
          git clone --depth 1 --branch snapshot https://github.com/castle-engine/castle-engine.git "$HOME/castle-engine"
          # The script expects to run from the engine's directory (castle-fpc.cfg).
          cd "$HOME/castle-engine" && ./tools/build-tool/castle-engine_compile.sh

      - name: Compile
        timeout-minutes: 10
        run: |
          CASTLE_ENGINE_PATH="$HOME/castle-engine" "$HOME/castle-engine/tools/build-tool/castle-engine" compile --mode=release

      - name: Run autotests
        timeout-minutes: 15
        run: |
          xvfb-run -a -s "-screen 0 1280x800x24" python3 tools/run_autotests.py ./castle-doom autotest-output

      - name: Upload logs and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autotest-output
          path: |
            autotest-output/*.log
            autotest-output/*.png
          if-no-files-found: warn

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(inputs.release_tag, 'v')
    needs: [build-native, build-macos]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.release_tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: packages
      - name: List packages
        run: ls -l packages
      # The release notes: this version's section of docs/CHANGELOG.md.
      - name: Release notes from the changelog
        run: |
          awk -v v="## $TAG " 'index($0, v) == 1 { on = 1; next } /^## / { on = 0 } on' docs/CHANGELOG.md > notes.md
          cat notes.md
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: Castle DOOM ${{ env.TAG }}
          body_path: notes.md
          files: |
            packages/*.zip
            packages/*.tar.gz
          generate_release_notes: true
